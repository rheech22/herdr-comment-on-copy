id = "comment_on_copy"
name = "Comment on Copy"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Drag to select terminal text, add feedback, and send it with context to an agent."
platforms = ["macos", "windows", "linux"]

[[build]]
command = ["bun", "run", "scripts/run.ts", "install"]

[[actions]]
id = "toggle"
title = "Toggle comment on copy"
description = "While on, copying opens a comment window."
contexts = ["global"]
command = ["bun", "run", "scripts/run.ts", "toggle"]

[[actions]]
id = "open"
title = "Comment on selected or copied text"
description = "Open a comment without clipboard monitoring."
contexts = ["global", "selection"]
command = ["bun", "run", "scripts/run.ts", "open"]

[[actions]]
id = "collection"
title = "Open collected comments"
description = "Browse collected text and comments without copying new text."
contexts = ["global"]
command = ["bun", "run", "scripts/run.ts", "collection"]

[[panes]]
id = "note"
title = "comment on copy"
placement = "popup"
width = 88
height = 20
command = ["bun", "run", "scripts/run.ts", "note"]
